urdf: serial_pm_v2.urdf
xml: pm_v2.xml

model_param:
  num_total_joints: 24
  num_contacts: 4
  num_single_contact_dimensions: 2

sensor:
  imu_topic: /hardware/imu_info
  lidar_topic: /livox/lidar
  lidar_frame_id: livox_frame
  lidar_parent_frame_id: world
  lidar_rate_hz: 10.0
  lidar_min_range: 0.1
  lidar_max_range: 70.0
  lidar_points_per_scan: 1000
  lidar_horizontal_fov_deg: 360.0
  lidar_vertical_fov_min_deg: -7.0
  lidar_vertical_fov_max_deg: 52.0

actuator:
  joint_state_topic: /hardware/joint_state
  joint_command_topic: /hardware/joint_command
